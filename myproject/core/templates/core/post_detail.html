<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body>
    <!-- this is show to only single post based on post_id -->
   
    <aside class="bg-black text-white p-6 rounded-lg w-full max-w-lg font-mono">
            <div class="flex justify-between items-center">
                <div class="flex space-x-2 text-red-500">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <p class="text-sm">bash</p>
            </div>
            <div class="mt-4">
                <p class="text-green-400">{{ post.title }}</p>
                {% if post.category %}
                <p>Category: <strong> {{ post.category.name }}</strong></p>
                {% else %}
                <p>Category: Uncategorized</p>
                {% endif %}
                
                <p>Author : {{ post.author }}</p>
                <p class="text-white">{{ post.created_at }}</p>

                <hr>

                <p class="text-white">{{ post.content }} </p>
                <p class="text-green-400">$</p>

                <a href="/">Back to Home</a>
            </div>
    </aside>
    
</body>
</html>
