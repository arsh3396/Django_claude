<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Contact Us</h1>
    <form method="POST">
        {% csrf_token %}    
        {{ form.as_p }}
        {% if messages %}
            {% for message in messages %}
                <div style="color: green;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        <button type="submit">Send Message</button>
    </form>
</body>
</html>
